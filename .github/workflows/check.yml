name: Check padel courts

on:
  schedule:
    - cron: "*/10 6-21 * * *"   # every 10 min, 6:00-21:59 (UTC)
  workflow_dispatch:             # adds a "Run workflow" button for testing

permissions:
  contents: write                # lets the bot save its memory file

concurrency:
  group: padel                   # never run two checks at once

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: Europe/London                          # use London time for dates
      NTFY_CHANNEL: ${{ secrets.NTFY_CHANNEL }}  # the hidden channel name
    steps:
      - uses: actions/checkout@v5

      - name: Look for free courts
        run: python3 check_courts.py

      - name: Save the bot's memory
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add seen_slots.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Update seen slots"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null
            echo "Save clashed with another run, retrying..."
            sleep 5
          done
          echo "Couldn't save memory this time - the next run will try again."
