   name: Check padel courts

   on:
     schedule:
       - cron: "*/20 6-21 * * *"   # every 20 min, 6:00-21:59 (UTC)
     workflow_dispatch:             # adds a "Run workflow" button for testing

   permissions:
     contents: write                # lets the bot save its memory file

   concurrency:
     group: padel                   # never run two checks at once

   jobs:
     check:
       runs-on: ubuntu-latest
       timeout-minutes: 3
       env:
         TZ: Europe/London          # use London time for dates
       steps:
         - uses: actions/checkout@v4

         - name: Look for free courts
           run: python3 check_courts.py

         - name: Save the bot's memory
           run: |
             git config user.name "padel-bot"
             git config user.email "padel-bot@users.noreply.github.com"
             git add seen_slots.json
             git diff --cached --quiet || git commit -m "Update seen slots"
             git push
